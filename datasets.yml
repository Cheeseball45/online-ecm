# datasets.yml — Dataset registry for online-ecm ingestion
#
# Add a new entry here for each dataset you want to ingest.
# Then run: python ingest.py
#
# source types:
#   arbin        — Arbin BT2000 Excel export (.xlsx)
#   maccor       — Maccor Series 4000 text export (.txt)
#   stanford_csv — Severson et al. 2019 CSV (QC, QD, IR, Tavg, chargetime...)
#   nasa_csv     — NASA battery dataset CSV (voltage, temperature, capacity, soh, rul)

datasets:

  # ── Stanford cycle life dataset ──────────────────────────────────────────
  - name:    Stanford_CycleLife_2019
    source:  stanford_csv
    enabled: true
    files:
      full:  data/stanford/Lithium-Ion Battery Cycle Life.csv
      100cy: data/stanford/100_Cycle_Lithium-Ion Battery Cycle Life.csv
      50cy:  data/stanford/50_Cycle_Lithium-Ion Battery Cycle Life.csv
    cell_meta:
      manufacturer:    A123 Systems
      manufacturer_pn: APR18650M1A
      form_factor:     18650
      capacity_mah:    1100
      chemistry:       LFP/graphite
    project: Stanford_CycleLife_2019
    customer: Public

  # ── NASA battery dataset ─────────────────────────────────────────────────
  - name:    NASA_Battery_2023
    source:  nasa_csv
    enabled: true
    file:    data/nasa/battery_cycle_level_dataset_CLEAN_FINAL.csv
    cell_meta:
      manufacturer:    NASA
      manufacturer_pn: NASA-18650
      form_factor:     18650
      capacity_mah:    2000
      chemistry:       LCO
    project: NASA_Battery
    customer: Public

